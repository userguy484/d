name: Build DLL and Injector

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout User Code
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        
    # 1. Build the Luau DLL
    - name: Clone and Build Luau
      run: |
        git clone --depth 1 https://github.com/luau-lang/luau.git
        cd luau
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
        cmake --build build --config Release --target Luau.VM
        
    - name: Compile dd.cpp to DLL
      run: |
        cl /EHsc /O2 /MD /LD dd.cpp /Fe:dd.dll /Iluau\VM\include /Iluau\Common\include /link /LIBPATH:luau\build\VM\Release /LIBPATH:luau\build\Release Luau.VM.lib user32.lib msvcrt.lib
        
    # 2. Build the Injector EXE
    - name: Compile injector.cpp to EXE
      run: |
        cl /EHsc /O2 injector.cpp /Fe:injector.exe user32.lib
        
    # 3. Upload both files
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Executor-Complete
        path: |
          dd.dll
          injector.exe
        retention-days: 7
