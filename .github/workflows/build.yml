name: Build DLL and Injector

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout User Code
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        
    - name: Clone and Build Luau
      run: |
        git clone --depth 1 https://github.com/luau-lang/luau.git
        cd luau
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
        cmake --build build --config Release --target Luau.VM
        cmake --build build --config Release --target Luau.Compiler
        cmake --build build --config Release --target Luau.Ast
        cmake --build build --config Release --target Luau.Common
        cmake --build build --config Release --target Luau.Config
        
    - name: Compile dd.cpp to DLL
      run: |
        cl /EHsc /O2 /MD /std:c++17 /LD dd.cpp /Fe:dd.dll /Iluau\VM\include /Iluau\Compiler\include /Iluau\Common\include /Iluau\Ast\include /Iluau\Config\include /link /LIBPATH:luau\build\VM\Release /LIBPATH:luau\build\Compiler\Release /LIBPATH:luau\build\Ast\Release /LIBPATH:luau\build\Common\Release /LIBPATH:luau\build\Config\Release /LIBPATH:luau\build\Release /WHOLEARCHIVE:Luau.Compiler.lib /WHOLEARCHIVE:Luau.Ast.lib /WHOLEARCHIVE:Luau.Common.lib /WHOLEARCHIVE:Luau.Config.lib /WHOLEARCHIVE:Luau.VM.lib user32.lib msvcrt.lib
        
    - name: Compile injector.cpp to EXE
      run: |
        cl /EHsc /O2 injector.cpp /Fe:injector.exe user32.lib
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Executor-Complete
        path: |
          dd.dll
          injector.exe
        retention-days: 7
