name: Build Executor with Luau

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout User Code
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        
    - name: Clone and Build Luau
      run: |
        git clone --depth 1 https://github.com/luau-lang/luau.git
        cd luau
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
        cmake --build build --config Release --target Luau.VM
        
    - name: Compile dd.cpp to DLL
      run: cl /EHsc /O2 /LD dd.cpp /Fe:dd.dll /I"luau\VM\include" /I"luau\Common\include" /link /LIBPATH:"luau\build\Release" Luau.VM.lib user32.lib
      
    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Real-Luau-Executor
        path: dd.dll
        retention-days: 7
