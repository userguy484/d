name: Build Clean Executor

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        
    - name: Clone Dependencies
      shell: bash
      run: |
        git clone --depth 1 https://github.com/luau-lang/luau.git
        git clone --depth 1 https://github.com/ocornut/imgui.git
        
    - name: Build Luau
      shell: bash
      run: |
        cd luau
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded"
        cmake --build build --config Release
        
    - name: Combine Libraries (Fixes Linker Errors)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path libs
        Get-ChildItem -Path luau -Filter *.lib -Recurse | Copy-Item -Destination libs
        cd libs
        cmd /c "lib /OUT:LuauMonolith.lib *.lib"
        cd ..

    - name: Compile Internal DLL
      shell: cmd
      run: |
        cl /EHsc /O2 /MT /std:c++17 /LD dd.cpp /Fe:dd.dll /Iluau\VM\include /Iluau\Compiler\include /Iluau\Common\include /Iluau\Ast\include /Iluau\Config\include /link /LIBPATH:libs LuauMonolith.lib user32.lib
        
    - name: Compile External EXE
      shell: cmd
      run: |
        cl /EHsc /O2 /MT /std:c++17 injector.cpp imgui\imgui.cpp imgui\imgui_draw.cpp imgui\imgui_tables.cpp imgui\imgui_widgets.cpp imgui\backends\imgui_impl_win32.cpp imgui\backends\imgui_impl_dx11.cpp /Fe:injector.exe /Iimgui /Iimgui\backends /link user32.lib gdi32.lib d3d11.lib dxgi.lib dwmapi.lib
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Clean-Executor
        path: |
          dd.dll
          injector.exe
