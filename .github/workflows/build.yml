name: Build EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cl /EHsc /O2 main.cpp /Fe:app.exe
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-app
          path: app.exe
