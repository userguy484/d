name: Build Roblox Executor DLL

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        
    - name: Compile dd.cpp and stub.cpp to DLL
      run: cl /EHsc /O2 /LD dd.cpp stub.cpp /Fe:dd.dll /link user32.lib
      
    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-DLL
        path: dd.dll
        retention-days: 7
