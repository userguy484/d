name: Build Executor Suite

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        
    - name: Build Luau Engine
      shell: bash
      run: |
        git clone --depth 1 https://github.com/luau-lang/luau.git
        cd luau
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
        cmake --build build --config Release
        
    - name: Combine Libraries
      shell: cmd
      run: |
        mkdir libs
        for /r luau %%f in (*.lib) do copy "%%f" libs\
        cd libs
        lib /OUT:LuauMonolith.lib *.lib
        cd ..
        
    - name: Compile Internal DLL
      shell: cmd
      run: |
        cl /EHsc /O2 /MD /std:c++17 /LD dd.cpp /Fe:dd.dll /Iluau\VM\include /Iluau\Compiler\include /Iluau\Common\include /Iluau\Ast\include /Iluau\Config\include /link /LIBPATH:libs LuauMonolith.lib user32.lib msvcrt.lib
        
    - name: Compile External EXE
      shell: cmd
      run: |
        cl /EHsc /O2 injector.cpp /Fe:injector.exe user32.lib
        
    - name: Upload Everything
      uses: actions/upload-artifact@v4
      with:
        name: Wesoda-Complete-Executor
        path: |
          dd.dll
          injector.exe
        retention-days: 7
